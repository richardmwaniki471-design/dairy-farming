<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Records System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: green;
        }

        input,
        select {
            width: 220px;
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .save-btn {
            background: green;
        }

        .edit-btn {
            background: orange;
        }

        .delete-btn {
            background: red;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: green;
            color: white;
        }

        .stats {
            font-size: 22px;
            margin-bottom: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Store Records System</h1>

        <div class="stats">

            Total Store Deductions:
            <b>Ksh <span id="totalAmount">0</span></b>

            <br><br>

            Total Records:
            <b><span id="recordCount">0</span></b>

        </div>

        <h2>Store Entry Form</h2>

        <input type="date" id="date">

        <input type="text" id="farmerid" placeholder="Farmer ID">

        <input type="text" id="farmername" placeholder="Farmer Name">

        <select id="item">

            <option value="">
                Select Item
            </option>

            <option>Dairy Meal</option>

            <option>Hay</option>

            <option>Silage</option>

            <option>Salt Lick</option>

            <option>Minerals</option>

            <option>Concentrates</option>

        </select>

        <input type="number" id="quantity" placeholder="Quantity">

        <input type="number" id="amount" placeholder="Amount">

        <br><br>

        <button id="saveBtn" class="save-btn" onclick="saveRecord()">
            Save Record
        </button>

        <h2>Search Records</h2>

        <input type="text" id="search" placeholder="Search Farmer ID or Name" onkeyup="searchRecords()">

        <table id="recordTable">

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Farmer ID</th>
                    <th>Farmer Name</th>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

    <script>

        let editingRow = null;

        window.onload = function () {

            document.getElementById("date").value =
                new Date().toISOString().split("T")[0];

        };

        function saveRecord() {

            let date =
                document.getElementById("date").value;

            let farmerid =
                document.getElementById("farmerid").value;

            let farmername =
                document.getElementById("farmername").value;

            let item =
                document.getElementById("item").value;

            let quantity =
                document.getElementById("quantity").value;

            let amount =
                document.getElementById("amount").value;

            if (
                !date ||
                !farmerid ||
                !farmername ||
                !item ||
                !quantity ||
                !amount
            ) {
                alert("Please fill all fields");
                return;
            }

            if (editingRow !== null) {

                editingRow.cells[0].innerHTML = date;
                editingRow.cells[1].innerHTML = farmerid;
                editingRow.cells[2].innerHTML = farmername;
                editingRow.cells[3].innerHTML = item;
                editingRow.cells[4].innerHTML = quantity;
                editingRow.cells[5].innerHTML = amount;

                editingRow = null;

                document.getElementById("saveBtn").innerHTML =
                    "Save Record";

            } else {

                let table =
                    document.querySelector("#recordTable tbody");

                let row =
                    table.insertRow();

                row.insertCell(0).innerHTML = date;
                row.insertCell(1).innerHTML = farmerid;
                row.insertCell(2).innerHTML = farmername;
                row.insertCell(3).innerHTML = item;
                row.insertCell(4).innerHTML = quantity;
                row.insertCell(5).innerHTML = amount;

                row.insertCell(6).innerHTML =

                    `
<button class="edit-btn"
onclick="editRecord(this)">
Edit
</button>

<button class="delete-btn"
onclick="deleteRecord(this)">
Delete
</button>
`;

            }

            updateTotals();

            clearForm();

        }

        function editRecord(button) {

            let row =
                button.parentElement.parentElement;

            editingRow = row;

            document.getElementById("date").value =
                row.cells[0].innerText;

            document.getElementById("farmerid").value =
                row.cells[1].innerText;

            document.getElementById("farmername").value =
                row.cells[2].innerText;

            document.getElementById("item").value =
                row.cells[3].innerText;

            document.getElementById("quantity").value =
                row.cells[4].innerText;

            document.getElementById("amount").value =
                row.cells[5].innerText;

            document.getElementById("saveBtn").innerHTML =
                "Update Record";

        }

        function deleteRecord(button) {

            if (confirm("Delete this record?")) {

                let row =
                    button.parentElement.parentElement;

                row.remove();

                updateTotals();

            }

        }

        function updateTotals() {

            let total = 0;

            let rows =
                document.querySelectorAll(
                    "#recordTable tbody tr"
                );

            rows.forEach(row => {

                total += Number(row.cells[5].innerText);

            });

            document.getElementById(
                "totalAmount"
            ).innerText = total;

            document.getElementById(
                "recordCount"
            ).innerText = rows.length;

        }

        function searchRecords() {

            let filter =
                document.getElementById("search")
                    .value.toLowerCase();

            let rows =
                document.querySelectorAll(
                    "#recordTable tbody tr"
                );

            rows.forEach(row => {

                let text =
                    row.innerText.toLowerCase();

                row.style.display =
                    text.includes(filter)
                        ?
                        ""
                        :
                        "none";

            });

        }

        function clearForm() {

            document.getElementById("farmerid").value = "";
            document.getElementById("farmername").value = "";
            document.getElementById("item").value = "";
            document.getElementById("quantity").value = "";
            document.getElementById("amount").value = "";

            document.getElementById("saveBtn").innerHTML =
                "Save Record";

        }

    </script>

</body>

</html>

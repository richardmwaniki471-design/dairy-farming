<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Board Reports</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: green;
        }

        .card {
            padding: 20px;
            margin: 10px;
            background: #eef;
            border-radius: 10px;
            font-size: 24px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Board Monthly Report</h1>

        <div class="card">
            Total Registered Farmers:
            <b>250</b>
        </div>

        <div class="card">
            Total Milk Collected:
            <b>85,000 Litres</b>
        </div>

        <div class="card">
            Total Milk Value:
            <b>Ksh 4,250,000</b>
        </div>

        <div class="card">
            Total Agrovet Deductions:
            <b>Ksh 350,000</b>
        </div>

        <div class="card">
            Total Store Deductions:
            <b>Ksh 520,000</b>
        </div>

        <div class="card">
            Total Group Contributions:
            <b>Ksh 85,000</b>
        </div>

        <div class="card">
            Net Payments To Farmers:
            <b>Ksh 3,295,000</b>
        </div>

    </div>

</body>

</html>

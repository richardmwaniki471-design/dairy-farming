<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dairy Cooperative Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }

        .header {
            background: green;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            padding: 20px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card a {
            text-decoration: none;
            font-size: 28px;
            font-weight: bold;
            color: green;
            display: block;
        }

        .logout {
            display: block;
            width: 250px;
            margin: 30px auto;
            padding: 15px;
            text-align: center;
            background: red;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 22px;
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>Dairy Cooperative Management System</h1>

        <h2>Administration Dashboard</h2>

    </div>

    <div class="container">

        <div class="menu">

            <div class="card">
                <a href="login.html?module=farmers">
                    👨 Farmers
                </a>
            </div>

            <div class="card">
                <a href="login.html?module=milk">
                    🥛 Milk Collection
                </a>
            </div>

            <div class="card">
                <a href="login.html?module=agrovet">
                    💊 Agrovet Records
                </a>
            </div>

            <div class="card">
                <a href="login.html?module=store">
                    🏪 Store Records
                </a>
            </div>

            <div class="card">
                <a href="login.html?module=feed">
                    📦 Feed Orders
                </a>
            </div>

            <div class="card">
                <a href="login.html?module=dashboard">
                    📊 Farmer Dashboard
                </a>
            </div>

            <div class="card">
                <a href="login.html?module=payments">
                    💰 Monthly Payments
                </a>
            </div>

            <div class="card">
                <a href="login.html?module=reports">
                    📈 Board Reports
                </a>
            </div>

        </div>

        <a class="logout" href="login.html">

            Logout

        </a>

    </div>

</body>

</html>
